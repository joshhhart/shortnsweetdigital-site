name: Deploy site to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily-post pushes via GITHUB_TOKEN, which by design doesn't trigger
  # downstream workflows. Listen for it explicitly.
  workflow_run:
    workflows: ["Daily SEO post", "Backfill hero images"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # IndexNow step needs diff against parent commit

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=shortnsweetdigital --branch=main

      - name: Ping IndexNow
        run: node scripts/ping-indexnow.mjs
