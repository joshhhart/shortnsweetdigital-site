name: Lighthouse CI

on:
  schedule:
    - cron: '17 7 * * *'  # daily, just before the 8am content publish
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v11
        with:
          # Audit the Cloudflare Pages origin (*.pages.dev) instead of the
          # production domain. Cloudflare's Bot Fight Mode / WAF served the
          # LHCI headless Chrome an interstitial on every request to
          # shortnsweetdigital.com, aborting every audit with
          # CHROME_INTERSTITIAL_ERROR. The .pages.dev origin serves the same
          # built artifact without that protection layer, so we get clean
          # scores while real visitors keep the full Cloudflare shield.
          urls: |
            https://shortnsweetdigital.pages.dev/
            https://shortnsweetdigital.pages.dev/blog/
            https://shortnsweetdigital.pages.dev/about/
            https://shortnsweetdigital.pages.dev/pricing/
            https://shortnsweetdigital.pages.dev/compare/
            https://shortnsweetdigital.pages.dev/book-a-call/
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./.lighthouserc.json
