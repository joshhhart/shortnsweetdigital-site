name: Tighten over-long titles

# One-off / on-demand backfill. Rewrites titles >60 chars and descriptions
# >155 chars using the Anthropic API, then commits the result. Run from the
# Actions tab when you want to refresh SERP snippets.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tighten:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tighten titles + descriptions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/tighten-titles.mjs

      - name: Commit & push
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes — every title/description already fits."
            exit 0
          fi
          git config user.name  "agentic-jimmy[bot]"
          git config user.email "agentic-jimmy[bot]@users.noreply.github.com"
          git add src/content/blog
          git commit -m "chore(seo): tighten over-long titles + descriptions for SERP fit"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
