<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img" aria-label="Mallo, the marshmallow bot mascot">
  <defs>
    <radialGradient id="m-body" cx="38%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#fdf6f0"/>
      <stop offset="100%" stop-color="#e9dcea"/>
    </radialGradient>
    <radialGradient id="m-top" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3e9f1"/>
    </radialGradient>
    <linearGradient id="m-visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="m-eye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f2ff"/>
      <stop offset="45%" stop-color="#3b9bff"/>
      <stop offset="100%" stop-color="#188bf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="m-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="100" cy="206" rx="62" ry="10" fill="url(#m-shadow)"/>
  <!-- antenna -->
  <path d="M100 30 V14" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="11" r="7" fill="#ffb3cf"/>
  <circle cx="98" cy="9" r="2.4" fill="#fff" opacity=".9"/>
  <!-- arms -->
  <ellipse cx="30" cy="132" rx="14" ry="20" transform="rotate(20 30 132)" fill="url(#m-body)"/>
  <ellipse cx="170" cy="126" rx="14" ry="20" transform="rotate(-30 170 126)" fill="url(#m-body)"/>
  <!-- marshmallow body (squishy cylinder) -->
  <path d="M40 60 C40 36 160 36 160 60 V172 C160 200 40 200 40 172 Z" fill="url(#m-body)"/>
  <ellipse cx="100" cy="58" rx="60" ry="20" fill="url(#m-top)"/>
  <ellipse cx="80" cy="52" rx="24" ry="6" fill="#fff" opacity=".9"/>
  <!-- face visor -->
  <rect x="56" y="84" width="88" height="54" rx="27" fill="url(#m-visor)"/>
  <rect x="62" y="88" width="40" height="8" rx="4" fill="#fff" opacity=".08"/>
  <!-- glowing eyes -->
  <circle cx="82" cy="111" r="15" fill="url(#m-eye)"/>
  <circle cx="118" cy="111" r="15" fill="url(#m-eye)"/>
  <rect x="77" y="103" width="10" height="16" rx="5" fill="#e0f2ff"/>
  <rect x="113" y="103" width="10" height="16" rx="5" fill="#e0f2ff"/>
  <path d="M92 126 Q100 132 108 126" stroke="#93c5fd" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- blush -->
  <ellipse cx="58" cy="146" rx="10" ry="6" fill="#ffb3cf" opacity=".6"/>
  <ellipse cx="142" cy="146" rx="10" ry="6" fill="#ffb3cf" opacity=".6"/>
  <!-- chest light -->
  <circle cx="100" cy="164" r="6" fill="#3b9bff" opacity=".85"/>
  <circle cx="98.5" cy="162.5" r="2" fill="#fff"/>
</svg>
